<!doctype html>

    <meta charset="UTF-8" />
    <script>
      // AI Studio preview environment: suppress Vite HMR WebSocket connection errors
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || '')) + '';
        var file = (e && (e.filename || '')) + '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('@vite/client') ||
          file.includes('@vite/client')
        ) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          msg.includes('@vite/client')
        ) {
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
      }, true);
    </script>
